modules:
  jira:projectPage:
    - key: control-tower-x-project
      title: Control Tower X
      resource: project-ui
      resolver:
        function: project-resolver
  function:
    - key: project-resolver
      handler: index.handler
resources:
  - key: project-ui
    path: static/control-tower/dist
permissions:
  scopes:
    - read:jira-work
app:
  # forge register writes the installation-independent app ARI here.
  runtime:
    name: nodejs22.x
